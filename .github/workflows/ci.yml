name: CI

# 每次推送和 PR 都跑一遍。发布前才发现编译不过就太晚了。
#
# action 只钉大版本（@v7 而不是 @v7.0.1）：补丁能自动跟上，
# 而大版本升级往往伴随运行时或参数变化，需要人看一眼。
# GitHub 淘汰 Node 20 运行时后必须整体上一个台阶，这里已经是 node24 那一档。
on:
  push:
    branches: [main, master]
  pull_request:

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '24'

jobs:
  web:
    name: 前端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - name: 类型检查
        working-directory: web
        run: npx vue-tsc --noEmit -p tsconfig.app.json
      - name: 构建
        working-directory: web
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: server/internal/web/dist
          retention-days: 1
          if-no-files-found: error

  go:
    name: 后端
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: server/internal/web/dist
      - name: gofmt
        working-directory: server
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "以下文件没有格式化：" && echo "$out"
            exit 1
          fi
      - name: go vet
        working-directory: server
        run: go vet ./...
      - name: go test
        working-directory: server
        run: go test ./...

  # 安装脚本也要测。它是从管道里直接执行的，坏了就是「用户装不上」，
  # 而且最容易出的那类错（set -e 撞上 && 短路）只在某一个平台暴露 ——
  # 真在 Linux 上炸过一次，Windows 分支恰好恒真所以本地测不出来。
  install:
    name: 安装脚本
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -s sh scripts/install.sh scripts/test-install.sh
      - name: 自检
        run: sh scripts/test-install.sh scripts/install.sh

      # systemd 对写错位置的键只会打一行 "Unknown key ... ignoring" 然后无视。
      # 真出过一次：StartLimitIntervalSec 写在了 [Service] 里，于是
      # "别刷屏重启" 的保护形同虚设，配上 Restart=always 就是每 5 秒无限重启。
      # 这个检查器能把那类错拎出来。
      - name: 检查 systemd 单元
        run: |
          out=$(systemd-analyze verify scripts/moecard.service 2>&1 || true)
          # ExecStart 指向的是安装后的路径，CI 里当然不存在，这条要滤掉；
          # 真正要拦的是键名写错、写错段落、语法错这一类。
          real=$(echo "$out" | grep -vE 'is not executable|No such file or directory' || true)
          if [ -n "$real" ]; then
            echo "单元文件有问题："; echo "$real"; exit 1
          fi
          echo "无告警（仅有预期内的 ExecStart 路径提示）"

  # 六个目标平台都试编一遍。跨平台编译坏掉通常是引了带 CGO 或者
  # 只在某个系统上存在的包，越早发现越好。
  cross:
    name: 交叉编译
    runs-on: ubuntu-latest
    needs: [web, go]
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: server/internal/web/dist
      - working-directory: server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -o /dev/null ./cmd/server
