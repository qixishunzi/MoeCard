# MoeCard 部署编排
#
# 默认（SQLite）：
#   cp .env.example .env && 编辑 .env
#   docker compose up -d
#
# 需要 MySQL：
#   docker compose --profile mysql up -d
#   并在 .env 中设置 DB_DRIVER=mysql

services:
  moecard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: "1.0.0"
    image: moecard:1.0.0
    container_name: moecard
    restart: unless-stopped

    ports:
      - "${APP_PORT:-8080}:8080"

    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_PORT: 8080
      APP_KEY: ${APP_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE: ${JWT_EXPIRE:-12h}

      # 外部访问地址。**必须配置成公网可访问的地址** ——
      # 支付平台的异步回调会打到 BASE_URL 上，填错就收不到支付通知。
      BASE_URL: ${BASE_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      TRUST_PROXY: ${TRUST_PROXY:-false}

      DB_DRIVER: ${DB_DRIVER:-sqlite}
      SQLITE_PATH: /app/data/moecard.db
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-moecard}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-moecard}

      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      STORAGE_MAX_SIZE: ${STORAGE_MAX_SIZE:-5242880}

    volumes:
      # 数据库与上传文件必须持久化，否则容器重建就全没了
      - moecard-data:/app/data
      - moecard-storage:/app/storage

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    # 这里刻意不写 depends_on：
    #   1. mysql 在 profile 里，未启用时 depends_on 会让旧版 Compose 直接报错
    #   2. 应用启动时已内置数据库连接重试（见 database.Open），
    #      MySQL 晚几秒起来也不会导致容器崩溃退出
    # 这比依赖 Compose 的编排顺序更可靠 —— 生产环境 DB 重启时也能自愈。

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # MySQL 是可选的。默认不启动，需要时加 --profile mysql
  mysql:
    image: mysql:8.0
    container_name: moecard-mysql
    restart: unless-stopped
    profiles: ["mysql"]

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-moecard}
      MYSQL_USER: ${MYSQL_USERNAME:-moecard}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      TZ: UTC

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 数据库统一用 UTC，展示时区由应用层转换
      - --default-time-zone=+00:00
      - --max-connections=200

    volumes:
      - moecard-mysql:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    # 默认不暴露端口。需要从宿主机直连调试时再打开。
    # ports:
    #   - "3306:3306"

volumes:
  moecard-data:
  moecard-storage:
  moecard-mysql:
